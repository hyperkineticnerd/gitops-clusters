apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitops-redirecterr
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: In
              values:
                - production
  template:
    metadata:
      name: '{{ .name }}-redirecterr'
    spec:
      project: '{{ .name }}'

      destination:
        server: '{{ .server }}'
        namespace: arr-management

      sources:
        - repoURL: https://charts.hknlab.io
          chart: redirecterr
          targetRevision: 0.1.1
          helm:
            releaseName: redirecterr
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/cluster/{{.name}}/values/redirecterr.yaml

        - repoURL: https://gitlab.developer.hkn.lab/IaC/openshift4/clusters/all.git
          targetRevision: HEAD
          path: cluster/{{.name}}/extras/redirecterr
          ref: values

      syncPolicy:
        automated:
          prune: false
        syncOptions:
        - CreateNamespace=true
