apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitops-rhacs
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        values:
          env: '{{index .metadata.labels "environment"}}'
          cluster: '{{ .name }}'
        # selector:
        #   matchExpressions:
        #     - key: environment
        #       operator: In
        #       values:
        #         - management
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{ .name }}-rhacs'
    spec:
      project: '{{ .name }}'

      destination:
        server: '{{ .server }}'
        namespace: rhacs-operator

      sources:
        - repoURL: https://charts.hknlab.io
          chart: olm-operator
          targetRevision: 0.3.0
          helm:
            releaseName: rhacs
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/environment/all/values/rhacs.yaml
              - $values/environment/{{ .values.env }}/values/rhacs.yaml
              - $values/cluster/{{ .values.cluster }}/values/rhacs.yaml

        - repoURL: https://gitlab.developer.hkn.lab/IaC/openshift4/clusters/all.git
          targetRevision: HEAD
          # path: cluster/{{ .name }}/extras/nmstate
          ref: values

      syncPolicy:
        automated:
          enabled: false
          prune: false
          selfHeal: false
        syncOptions:
        - CreateNamespace=true
