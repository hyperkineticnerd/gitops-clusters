apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitops-rhacs
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: In
              values:
                - management
                - development
                - test
                - production
        values:
          env: '{{index .metadata.labels "environment"}}'
  ignoreApplicationDifferences:
    - jqPathExpressions:
        - .spec.syncPolicy
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{ .name }}-rhacs'
    spec:
      project: '{{ .name }}'

      destination:
        server: '{{ .server }}'
        namespace: rhacs-operator

      sources:
        - repoURL: https://gitlab.developer.hkn.lab/IaC/openshift4/clusters/all.git
          targetRevision: HEAD
          # path: cluster/{{ .name }}/extras/nmstate
          ref: values

        - repoURL: oci://ghcr.io/hyperkineticnerd/charts/olm-operator
          # chart: olm-operator
          path: .
          targetRevision: 0.8.0
          helm:
            releaseName: rhacs
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/environment/all/values/rhacs.yaml
              - $values/environment/{{ .values.env }}/values/rhacs.yaml
              - $values/cluster/{{ .name }}/values/rhacs.yaml

      syncPolicy:
        automated:
          enabled: false
          prune: false
          selfHeal: false
        syncOptions:
        - CreateNamespace=true
