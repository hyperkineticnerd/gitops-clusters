apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitops-cluster-configuration
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        values:
          env: '{{ index .metadata.labels "environment" }}'
        # selector:
        #   matchExpressions:
        #     - key: vendor
        #       operator: In
        #       values:
        #         - Openshift
  ignoreApplicationDifferences:
    - jqPathExpressions:
        - .spec.syncPolicy
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{ .name }}-cluster-configuration'
    spec:
      project: '{{ .name }}'

      destination:
        server: '{{ .server }}'
        namespace: openshift-config

      sources:
        - repoURL: https://gitlab.developer.hkn.lab/IaC/openshift4/clusters/all.git
          targetRevision: HEAD
          # path: cluster/{{ .name }}/extras/openshift-configuration
          ref: values

        - repoURL: oci://ghcr.io/hyperkineticnerd/charts/openshift-configuration
          # chart: openshift-configuration
          path: .
          targetRevision: 0.8.0
          helm:
            releaseName: '{{ .name }}'
            ignoreMissingValueFiles: true
            valueFiles:
                - $values/environment/{{ .values.env }}/values/cluster-configuration.yaml
                - $values/cluster/{{ .name }}/values/cluster-configuration.yaml

      syncPolicy:
        automated:
          enabled: false
          prune: false
          selfHeal: false
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
          - ServerSideApply=true
