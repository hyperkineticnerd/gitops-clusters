apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitops-metallb
  namespace: openshift-gitops
  annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: In
              values:
                - management
  ignoreApplicationDifferences:
    - jqPathExpressions:
        - .spec.syncPolicy
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{ .name }}-metallb'
    spec:
      project: '{{ .name }}'

      destination:
        server: '{{ .server }}'
        namespace: metallb-system

      sources:
        - repoURL: https://gitlab.developer.hkn.lab/IaC/openshift4/clusters/all.git
          targetRevision: HEAD
          # path: cluster/{{.name}}/extras/metallb
          ref: values

        - repoURL: oci://ghcr.io/hyperkineticnerd/charts/metallb-operator
          # chart: metallb-operator
          path: .
          targetRevision: 0.8.0
          helm:
            releaseName: metallb

        - repoURL: oci://ghcr.io/hyperkineticnerd/charts/metallb-bgp
          # chart: metallb-bgp
          path: .
          targetRevision: 0.8.0
          helm:
            releaseName: metallb
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/cluster/hub/values/bgp.yaml

        - repoURL: oci://ghcr.io/hyperkineticnerd/charts/metallb-loadbalancer
          # chart: metallb-loadbalancer
          path: .
          targetRevision: 0.8.0
          helm:
            releaseName: metallb
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/cluster/hub/values/lb.yaml

      syncPolicy:
        automated:
          prune: true
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
          - SkipDryRunOnMissingResource=true
