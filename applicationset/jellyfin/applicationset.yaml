apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitops-jellyfin
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: In
              values:
                - production
  ignoreApplicationDifferences:
    - jqPathExpressions:
        - .spec.syncPolicy
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{ .name }}-jellyfin'
    spec:
      project: '{{ .name }}'

      destination:
        server: '{{ .server }}'
        namespace: jellyfin

      sources:
        - repoURL: https://gitlab.developer.hkn.lab/IaC/openshift4/clusters/all.git
          targetRevision: HEAD
          path: cluster/{{ .name }}/extras/jellyfin
          ref: values

        - repoURL: oci://ghcr.io/hyperkineticnerd/charts/jellyfin
          # chart: jellyfin
          path: .
          targetRevision: 0.8.0
          helm:
            releaseName: jellyfin
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/environment/{{ index .metadata.labels "environment" }}/values/jellyfin.yaml
              - $values/cluster/{{ .name }}/values/jellyfin.yaml

      syncPolicy:
        syncOptions:
          - CreateNamespace=true
