apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitops-hosted-clusters
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://gitlab.developer.hkn.lab/IaC/openshift4/clusters/all.git
        revision: HEAD
        files:
          - path: cluster/**/values/hosted-control-planes.yaml
        values:
          cluster: '{{ index .path.segments 1 }}'
  ignoreApplicationDifferences:
    - jqPathExpressions:
        - .spec.syncPolicy
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: 'hosted-cluster-{{ .values.cluster }}'
    spec:
      project: hosted-clusters

      destination:
        server: https://kubernetes.default.svc
        namespace: clusters

      sources:
        - repoURL: https://gitlab.developer.hkn.lab/IaC/openshift4/clusters/all.git
          targetRevision: HEAD
          path: cluster/{{ .values.cluster }}/extras/hosted-control-planes
          ref: values

        - repoURL: oci://ghcr.io/hyperkineticnerd/charts/hosted-control-planes-metallb
          # chart: hosted-control-planes-metallb
          path: .
          targetRevision: 0.8.0
          helm:
            releaseName: '{{ .values.cluster }}'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/cluster/{{ .values.cluster }}/values/hosted-control-planes.yaml

        - repoURL: oci://ghcr.io/hyperkineticnerd/charts/hosted-control-planes
          # chart: hosted-control-planes
          path: .
          targetRevision: 0.8.0
          helm:
            releaseName: '{{ .values.cluster }}'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/cluster/{{ .values.cluster }}/values/hosted-control-planes.yaml

      syncPolicy:
        automated:
          enabled: false
          prune: false
          selfHeal: false
        syncOptions:
          - CreateNamespace=true
