apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitops-cert-manager
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: In
              values:
                - production
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{ .name }}-cert-manager'
    spec:
      project: '{{ .name }}'

      destination:
        server: '{{ .server }}'
        namespace: cert-manager

      sources:
        - repoURL: https://gitlab.developer.hkn.lab/IaC/openshift4/clusters/all.git
          targetRevision: HEAD
          path: cluster/{{ .name }}/extras/cert-manager
          ref: values

        - repoURL: oci://quay.io/jetstack/charts/cert-manager
          path: .
          # chart: cert-manager
          targetRevision: v1.19.2
          helm:
            releaseName: cert-manager
            # ignoreMissingValueFiles: true
            # valueFiles:
            valuesObject:
              crds:
                enabled: true

      syncPolicy:
        syncOptions:
        - CreateNamespace=true
