apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitops-nmstate
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            environment: management
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{ .name }}-nmstate'
    spec:
      project: '{{ .name }}'

      destination:
        server: '{{ .server }}'
        namespace: openshift-nmstate

      sources:
        - repoURL: https://charts.hknlab.io
          chart: nmstate
          targetRevision: 0.1.0
          helm:
            releaseName: nmstate
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/cluster/hub/values/nmstate.yaml

        - repoURL: https://gitlab.developer.hkn.lab/IaC/openshift4/clusters/all.git
          targetRevision: HEAD
          # path: cluster/hub/extras/nmstate
          ref: values

      syncPolicy:
        automated:
          enabled: false
          prune: false
          selfHeal: false
        syncOptions:
        - CreateNamespace=true
