apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitops-nmstate
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: In
              values:
                - management
  ignoreApplicationDifferences:
    - jqPathExpressions:
        - .spec.syncPolicy
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{ .name }}-nmstate'
    spec:
      project: '{{ .name }}'

      destination:
        server: '{{ .server }}'
        namespace: openshift-nmstate

      sources:
        - repoURL: https://gitlab.developer.hkn.lab/IaC/openshift4/clusters/all.git
          targetRevision: HEAD
          # path: cluster/hub/extras/nmstate
          ref: values

        # - repoURL: oci://ghcr.io/hyperkineticnerd/charts/olm-operator
        #   # chart: olm-operator
        #   path: .
        #   targetRevision: 0.8.0
        #   helm:
        #     releaseName: nmstate-operator
        #     ignoreMissingValueFiles: true
        #     valueFiles:
        #       - $values/cluster/hub/values/nmstate-operator.yaml

        - repoURL: oci://ghcr.io/hyperkineticnerd/charts/nmstate
          # chart: nmstate
          path: .
          targetRevision: 0.8.0
          helm:
            releaseName: nmstate
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/cluster/hub/values/nmstate.yaml

      syncPolicy:
        automated:
          enabled: false
          prune: false
          selfHeal: false
        syncOptions:
        - CreateNamespace=true
