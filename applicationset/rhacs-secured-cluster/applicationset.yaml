apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitops-rhacs-secured-cluster
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: In
              values:
                - development
                - test
                - production
        values:
          env: '{{index .metadata.labels "environment"}}'
  ignoreApplicationDifferences:
    - jqPathExpressions:
        - .spec.syncPolicy
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{ .name }}-rhacs-secured-cluster'
    spec:
      project: '{{ .name }}'

      destination:
        server: '{{ .server }}'
        namespace: stackrox

      sources:
        - repoURL: https://gitlab.developer.hkn.lab/IaC/openshift4/clusters/all.git
          targetRevision: HEAD
          path: environment/all/extras/rhacs-secured-cluster
          ref: values

        - repoURL: oci://ghcr.io/hyperkineticnerd/charts/rhacs-secured-cluster
          # chart: rhacs-secured-cluster
          path: .
          targetRevision: 0.8.0
          helm:
            releaseName: rhacs-secured-cluster
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/environment/{{ .values.env }}/values/rhacs-secured-cluster.yaml
              - $values/cluster/{{ .name }}/values/rhacs-secured-cluster.yaml
            valuesObject:
              clusterName: '{{ .name }}'

      syncPolicy:
        automated:
          enabled: false
          prune: false
          selfHeal: false
        syncOptions:
        - CreateNamespace=true
