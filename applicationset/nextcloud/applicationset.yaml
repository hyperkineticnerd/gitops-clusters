apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitops-nextcloud
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: In
              values:
                - production
  template:
    metadata:
      name: '{{ .name }}-nextcloud'
    spec:
      project: '{{ .name }}'

      destination:
        server: '{{ .server }}'
        namespace: nextcloud

      # sources:
      # - repoURL: https://gitlab.developer.hkn.lab/IaC/openshift4/clusters/all.git
      #   targetRevision: HEAD
      #   ref: values
      # - repoURL: https://nextcloud.github.io/helm/
      #   targetRevision: 3.4.1
      #   chart: nextcloud
      #   helm:
      #     releaseName: nextcloud
      #     valueFiles:
      #     - $values/gitops/applications/value-files/nextcloud.yaml

      sources:
        - repoURL: https://nextcloud.github.io/helm/
          targetRevision: 3.4.1
          chart: nextcloud
          helm:
            releaseName: nextcloud
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/clusters/{{.name}}/values/nextcloud.yaml

        - repoURL: https://gitlab.developer.hkn.lab/IaC/openshift4/clusters/all.git
          targetRevision: HEAD
          path: clusters/{{.name}}/extras/nextcloud
          ref: values

      syncPolicy:
        automated:
          prune: false
        syncOptions:
        - CreateNamespace=true
