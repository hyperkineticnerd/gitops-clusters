apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitops-metube
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: In
              values:
                - production
  ignoreApplicationDifferences:
    - jqPathExpressions:
        - .spec.syncPolicy
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{ .name }}-metube'
    spec:
      project: '{{ .name }}'

      destination:
        server: '{{ .server }}'
        namespace: metube

      sources:
        - repoURL: https://gitlab.developer.hkn.lab/IaC/openshift4/clusters/all.git
          targetRevision: HEAD
          path: cluster/{{.name}}/extras/metube
          ref: values

        - repoURL: oci://ghcr.io/hyperkineticnerd/charts/metube
          # chart: metube
          path: .
          targetRevision: 0.8.0
          helm:
            releaseName: metube
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/cluster/{{.name}}/values/metube.yaml

      syncPolicy:
        automated:
          enabled: false
          prune: false
          selfHeal: false
        syncOptions:
        - CreateNamespace=true

      # ignoreDifferences:
      #   - group: Batch
      #     kind: Job
