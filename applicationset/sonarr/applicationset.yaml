apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitops-sonarr
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: In
              values:
                - production
  template:
    metadata:
      name: '{{ .name }}-sonarr'
    spec:
      project: '{{ .name }}'

      destination:
        server: '{{ .server }}'
        namespace: arr-collectors

      sources:
        - repoURL: https://charts.hknlab.io
          chart: sonarr
          targetRevision: 0.1.3
          helm:
            releaseName: sonarr
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/cluster/{{.name}}/values/sonarr.yaml

        - repoURL: https://gitlab.developer.hkn.lab/IaC/openshift4/clusters/all.git
          targetRevision: HEAD
          path: clusters/{{.name}}/extras/sonarr
          ref: values

      syncPolicy:
        automated:
          prune: false
        syncOptions:
        - CreateNamespace=true
