apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitops-sonarr
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: In
              values:
                - production
  ignoreApplicationDifferences:
    - jqPathExpressions:
        - .spec.syncPolicy
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{ .name }}-sonarr'
    spec:
      project: '{{ .name }}'

      destination:
        server: '{{ .server }}'
        namespace: arr-collectors

      sources:
        - repoURL: https://gitlab.developer.hkn.lab/IaC/openshift4/clusters/all.git
          targetRevision: HEAD
          path: cluster/{{.name}}/extras/sonarr
          ref: values

        - repoURL: oci://ghcr.io/hyperkineticnerd/charts/sonarr
          # chart: sonarr
          path: .
          targetRevision: 0.8.1
          helm:
            releaseName: sonarr
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/cluster/{{.name}}/values/sonarr.yaml

      syncPolicy:
        automated:
          enabled: false
          prune: false
          selfHeal: false
        syncOptions:
        - CreateNamespace=true
