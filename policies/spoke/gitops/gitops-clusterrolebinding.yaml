apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: spoke-gitops-crb
  namespace: open-cluster-management-policies
  annotations:
    policy.open-cluster-management.io/categories: ""
    policy.open-cluster-management.io/controls: ""
    policy.open-cluster-management.io/description: Ensure the proper gitops rolebinding is applied to all clusters
    policy.open-cluster-management.io/standards: ""
spec:
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: spoke-gitops-crb
        spec:
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: cluster-admin-gitops-sc
                roleRef:
                  name: cluster-admin
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                subject:
                  - name: openshift-gitops-argocd-application-controller
                    namespace: openshift-gitops
                    kind: ServiceAccount
                  - name: openshift-gitops-applicationset-controller
                    namespace: openshift-gitops
                    kind: ServiceAccount
          remediationAction: inform
          severity: high
  remediationAction: enforce
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: spoke-gitops-crb-placement
  namespace: open-cluster-management-policies
spec:
  clusterSets:
    - global
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: name
              operator: NotIn
              values:
                - local-cluster
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: spoke-gitops-crb-placement-binding
  namespace: open-cluster-management-policies
placementRef:
  name: spoke-gitops-crb-placement
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: spoke-gitops-crb
    apiGroup: policy.open-cluster-management.io
    kind: Policy
