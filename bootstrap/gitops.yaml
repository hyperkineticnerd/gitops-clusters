apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bootstrap-gitops
  namespace: openshift-gitops
spec:
  syncPolicy:
    preserveResourcesOnDeletion: false
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://gitlab.developer.hkn.lab/IaC/openshift4/clusters/all.git
        revision: HEAD
        directories:
          - path: applicationsets/*
          - path: applicationsets/rhacs
            exclude: true
          - path: applicationsets/rhacs-secured-cluster
            exclude: true
          - path: applicationsets/rhacs-config
            exclude: true
          - path: applicationsets/home-assistant-openthread-border-router
            exclude: true
          - path: applicationsets/readarr
            exclude: true
          - path: applicationsets/redirecterr
            exclude: true
  template:
    metadata:
      name: 'bootstrap-{{ .path.basenameNormalized }}'
    spec:
      project: bootstrap

      destination:
        server: https://kubernetes.default.svc
        namespace: openshift-gitops

      sources:
        - repoURL: https://gitlab.developer.hkn.lab/IaC/openshift4/clusters/all.git
          targetRevision: HEAD
          path: '{{ .path.path }}'

      syncPolicy:
        syncOptions:
          - CreateNamespace=true
