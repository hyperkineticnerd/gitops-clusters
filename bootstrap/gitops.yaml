apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bootstrap-gitops
  namespace: openshift-gitops
spec:
  syncPolicy:
    preserveResourcesOnDeletion: false
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://gitlab.developer.hkn.lab/IaC/openshift4/clusters/all.git
        revision: HEAD
        directories:
          - path: applicationset/*
          - path: applicationset/rhacs
            exclude: true
          - path: applicationset/rhacs-secured-cluster
            exclude: true
          - path: applicationset/rhacs-config
            exclude: true
          - path: applicationset/home-assistant-openthread-border-router
            exclude: true
          - path: applicationset/readarr
            exclude: true
          - path: applicationset/redirecterr
            exclude: true
  template:
    metadata:
      name: 'bootstrap-{{ .path.basenameNormalized }}'
    spec:
      project: bootstrap

      destination:
        server: https://kubernetes.default.svc
        namespace: openshift-gitops

      sources:
        - repoURL: https://gitlab.developer.hkn.lab/IaC/openshift4/clusters/all.git
          targetRevision: HEAD
          path: '{{ .path.path }}'

      syncPolicy:
        automated:
          enabled: false
          prune: false
          selfHeal: false
        syncOptions:
          - CreateNamespace=true
