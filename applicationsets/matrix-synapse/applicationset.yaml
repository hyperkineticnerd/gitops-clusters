apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitops-matrix-synapse
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: In
              values:
                - production
  template:
    metadata:
      name: '{{ .name }}-matrix-synapse'
    spec:
      project: '{{ .name }}'

      destination:
        server: '{{ .server }}'
        namespace: matrix-synapse

      sources:
        - repoURL: https://gitlab.developer.hkn.lab/IaC/openshift4/clusters/all.git
          targetRevision: HEAD
          path: clusters/{{.name}}/extras/matrix-synapse
          ref: values

        - repoURL: https://gitlab.com/ananace/charts.git
          targetRevision: HEAD
          path: charts/matrix-synapse
          helm:
            releaseName: matrix-synapse
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/clusters/{{.name}}/values/matrix-synapse.yaml

      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
        - CreateNamespace=true

      ignoreDifferences:
        - group: Batch
          kind: Job
