kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: helm-home-assistant-otbr-scc
  namespace: home-assistant
subjects:
  - kind: ServiceAccount
    name: otbr
    namespace: home-assistant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: 'system:openshift:scc:privileged'
