global:
  openshift: true

injector:
  image:
    repository: "registry.connect.redhat.com/hashicorp/vault-k8s"
    tag: "1.7.0-ubi"

  agentImage:
    repository: "registry.connect.redhat.com/hashicorp/vault"
    tag: "1.20.4-ubi"

  webhook:
    timeoutSeconds: 10

server:
  image:
    repository: "registry.connect.redhat.com/hashicorp/vault"
    tag: "1.20.4-ubi"

  volumes:
    - name: userconfig-vault-storage-config
      secret:
        defaultMode: 420
        secretName: vault-storage-config

  volumeMounts:
    - name: userconfig-vault-storage-config
      mountPath: /vault/userconfig/vault-storage-config
      readOnly: true

  extraArgs: -config=/vault/userconfig/vault-storage-config/config.hcl

  readinessProbe:
    path: "/v1/sys/health?uninitcode=204"

  route:
    enabled: true
    activeService: false
    host: vault-vault.apps.hub.ocp4.hkn.lab
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Allow

  ha:
    enabled: true
    replicas: 1
    config: |
      ui = true
      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }

    raft:
      enabled: false
      replicas: 1

csi:
  image:
    repository: "registry.connect.redhat.com/hashicorp/vault-csi-provider"
    tag: "1.6.0-ubi"

  agent:
    image:
      repository: "registry.connect.redhat.com/hashicorp/vault"
      tag: "1.20.4-ubi"

ui:
  enabled: true
