# Default values for jellyseerr.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
#   repository: docker.io/fallenbagel/jellyseerr
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "develop"

imagePullSecrets: []
nameOverride: "seerr"
fullnameOverride: "seerr"

# env:
#   PUID: '1000'
#   PGID: '1000'
#   TZ: Etc/UTC
#   # LOG_LEVEL: debug

extraEnvFrom:
  - secretRef:
      name: seerr-database

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
  # openshift.io/required-scc: anyuid

podLabels: {}

# podSecurityContext: {}
  # fsGroup: 2000

# securityContext:
#   allowPrivilegeEscalation: true
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 5055

ingress:
  enabled: true
  ingressClassName: openshift-default
  annotations:
    route.openshift.io/termination: edge
    kubernetes.io/ingress.class: openshift-default
    cert-manager.io/cluster-issuer: letsencrypt
    # cert-manager.io/private-key-rotation-policy: always
    # acme.cert-manager.io/http01-ingress-class: openshift-default
  hosts:
    - host: seerr.apps.prod.openshift.hkn.lab
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

persistentVolumeClaims:
  config:
    enabled: true
    accessModes:
      - ReadWriteMany
    storageSize: 1Gi
    storageClassName: ""
    existingVolumeName: nfs-jellyseerr-config

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
