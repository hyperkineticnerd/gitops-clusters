apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr-external-secrets
  namespace: arr-collectors
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: sonarr-config
  dataFrom:
    - extract:
        key: apps/sonarr
