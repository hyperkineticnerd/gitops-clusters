apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openvpn-external-secrets
  namespace: arr-downloaders
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore  # or ClusterSecretStore
    name: vault-backend
  target:
    name: openvpn-secret
    template:
      engineVersion: v2
      data:
        VPN_SERVICE_PROVIDER: protonvpn
        VPN_TYPE: wireguard
        VPN_PORT_FORWARDING: "on"
        PORT_FORWARD_ONLY: "on"
        WIREGUARD_MTU: "1320"
        SERVER_COUNTRIES: Switzerland
        WIREGUARD_PRIVATE_KEY: {{ .WIREGUARD_PRIVATE_KEY }}

  data:
    - secretKey: WIREGUARD_PRIVATE_KEY
      remoteRef:
        key: apps/gluetun/protonvpn/config
        property: private_key

    # - secretKey: OPENVPN_USER
    #   remoteRef:
    #     key: apps/gluetun/protonvpn/config
    #     property: username

    # - secretKey: OPENVPN_PASSWORD
    #   remoteRef:
    #     key: apps/gluetun/protonvpn/config
    #     property: password
