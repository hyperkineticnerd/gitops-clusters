apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitops-environment-all
  namespace: openshift-gitops
spec:
  syncPolicy:
    preserveResourcesOnDeletion: false
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://gitlab.developer.hkn.lab/IaC/openshift4/clusters/all.git
        revision: HEAD
        directories:
          - path: environment/all/gitops/*
          - path: environment/all/gitops/rhacs
            exclude: true
          - path: environment/all/gitops/rhacs-secured-cluster
            exclude: true
  template:
    metadata:
      name: 'bootstrap-{{ .path.basename }}'
    spec:
      project: bootstrap

      destination:
        server: https://kubernetes.default.svc
        namespace: openshift-gitops

      sources:
        - repoURL: https://gitlab.developer.hkn.lab/IaC/openshift4/clusters/all.git
          targetRevision: HEAD
          path: '{{ .path.path }}'

      syncPolicy:
        syncOptions:
          - CreateNamespace=true
