networkInterface: eth0

serviceAccount:
  name: matter-server

service:
  port: 5580

ingress:
  enabled: true
  className: "openshift-default"
  annotations:
    route.openshift.io/termination: edge
  hosts:
    - host: matter-server.apps.hub.ocp4.hkn.lab
      paths: 
        - path: /
          pathType: ImplementationSpecific
  tls: []

