kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: helm-home-assistant-matter-server-scc
  namespace: home-assistant
subjects:
  - kind: ServiceAccount
    name: matter-server
    namespace: home-assistant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: 'system:openshift:scc:privileged'
