apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-secrets-hcp-pullsecret-test
  namespace: clusters
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: pullsecret-cluster-test
    template:
      type: kubernetes.io/dockerconfigjson
  dataFrom:
    - extract:
        key: cluster/test/install/pull-secret

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-secrets-hcp-sshkey-test
  namespace: clusters
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: sshkey-cluster-test
  data:
    - secretKey: id_rsa.pub
      remoteRef:
        key: cluster/test/install/ssh
        property: public_key
