---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-radarr-config
  labels:
    fstype: nfs
    app: radarr
spec:
  capacity:
    storage: 30Ti
  accessModes:
  - ReadWriteMany
  nfs:
    path: /volume1/docker/volumes/radarr
    server: 172.16.100.10
  persistentVolumeReclaimPolicy: Retain

