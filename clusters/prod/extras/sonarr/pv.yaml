---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-sonarr-config
  labels:
    fstype: nfs
    app: sonarr
spec:
  capacity:
    storage: 30Ti
  accessModes:
  - ReadWriteMany
  nfs:
    path: /volume1/docker/volumes/sonarr
    server: 172.16.100.10
  persistentVolumeReclaimPolicy: Retain

