---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-secrets-ingress-certs-prod
  namespace: openshift-ingress
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: ingress-certs-prod
  data:
    - secretKey: tls.crt
      remoteRef:
        key: cluster/prod/certs/apps
        property: tls.crt
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: tls.key
      remoteRef:
        key: cluster/prod/certs/apps
        property: tls.key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
