apiVersion: hypershift.openshift.io/v1beta1
kind: NodePool
metadata:
  annotations:
    hypershift.openshift.io/nodepool-supports-kubevirt-topology-spread-constraints: "true"
  finalizers:
  - hypershift.openshift.io/finalizer
  name: prod-infra
  namespace: clusters
spec:
  replicas: 3
  arch: amd64
  clusterName: prod
  release:
    image: quay.io/openshift-release-dev/ocp-release:4.18.42-multi
  nodeLabels:
    node-role.kubernetes.io/infra: ''
    # machine.openshift.io/cluster-api-machine-role: infra
    # machine.openshift.io/cluster-api-machine-type: infra
  taints:
    - key: node-role.kubernetes.io/infra
      value: reserved
      effect: NoSchedule
  management:
    autoRepair: false
    upgradeType: Replace
    replace:
      strategy: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
  platform:
    type: KubeVirt
    kubevirt:
      attachDefaultNetwork: true
      networkInterfaceMultiqueue: Enable
      compute:
        cores: 4
        memory: 16Gi
        qosClass: Burstable
      rootVolume:
        type: Persistent
        persistent:
          size: 120Gi
