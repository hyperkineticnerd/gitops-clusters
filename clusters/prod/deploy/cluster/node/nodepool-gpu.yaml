apiVersion: hypershift.openshift.io/v1beta1
kind: NodePool
metadata:
  annotations:
    hypershift.openshift.io/nodepool-supports-kubevirt-topology-spread-constraints: "true"
  finalizers:
  - hypershift.openshift.io/finalizer
  name: prod-gpus
  namespace: clusters
spec:
  replicas: 1
  arch: amd64
  clusterName: prod
  release:
    image: quay.io/openshift-release-dev/ocp-release:4.18.42-multi
  # nodeLabels:
  #   # node-role.kubernetes.io/infra: ''
  #   nvidia.com/GP104GL_TESLA_P4: "1"
  #   nvidia.com/gpu: "0"
  # taints:
  #   - key: nvidia.com/gpu
  #     operator: "Exists"
  #     effect: NoSchedule
  management:
    autoRepair: false
    upgradeType: Replace
    replace:
      strategy: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
  platform:
    type: KubeVirt
    kubevirt:
      attachDefaultNetwork: true
      compute:
        cores: 4
        memory: 16Gi
        qosClass: Burstable
      hostDevices:
        - count: 1
          deviceName: nvidia.com/GP104GL_TESLA_P4
      networkInterfaceMultiqueue: Enable
      rootVolume:
        type: Persistent
        persistent:
          size: 120Gi
