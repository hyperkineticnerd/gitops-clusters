# Default values for radarr.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/hotio/sabnzbd
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # sysctls:
  #   - name: net.ipv4.conf.IFNAME.src_valid_mark
  #     value:  "1"
  # fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: true
  privileged: true
  capabilities:
    add:
    - NET_ADMIN
  # readOnlyRootFilesystem: true
  runAsNonRoot: false
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: "openshift-default"
  annotations: 
    route.openshift.io/termination: edge
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: sabnzbd.apps.prod.openshift.hkn.lab
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

storage:
  config:
    accessModes: 
      - ReadWriteMany
    storageSize: 10Gi
    existingVolumeName: nfs-sabnzbd-config
    storageClassName: ''
  downloads:
    enabled: true
    existingClaimName: ''
    accessModes: 
      - ReadWriteMany
    storageSize: 1Ti
    existingVolumeName: nfs-sabnzbd-downloads
    storageClassName: ''
  incomplete:
    enabled: true
    existingClaimName: ''
    accessModes: 
      - ReadWriteMany
    storageSize: 1Ti
    existingVolumeName: nfs-sabnzbd-incomplete
    storageClassName: ''

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  requests:
    cpu: 1000m
    memory: 2Gi
  limits:
    cpu: 2000m
    memory: 4Gi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
